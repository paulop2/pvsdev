name = "pvsouza-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "DAILY_CAP"
id = "9ad9ef803890466681f82d4ff3102b80"

[[ratelimits]]
name = "CHAT_RATE"
namespace_id = "1001"

[ratelimits.simple]
limit = 10
period = 60

[vars]
CHAT_PROVIDER = "workers-ai"
CHAT_MODEL = "@cf/deepseek-ai/deepseek-v4-flash-0731"
DAILY_TOKEN_CAP = "100000"
ALLOWED_ORIGINS = "https://pvsouza.com,https://www.pvsouza.com,http://localhost:3000"

[[routes]]
pattern = "ai.pvsouza.com"
custom_domain = true
